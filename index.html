<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Convex Lens</title>
  </head>

  <body>
    <div class="app">
      <aside class="panel" id="panel">
        <h1>Convex Lens</h1>
        <p class="sub">Ray diagram for a thin converging lens</p>

        <div class="power">
          <span class="power-label">Light</span>
          <div class="switch" role="group" aria-label="Light">
            <button type="button" id="lightOff" aria-pressed="true">OFF</button>
            <button type="button" id="lightOn" aria-pressed="false">ON</button>
          </div>
        </div>

        <div class="modes" role="group" aria-label="Object">
          <button type="button" id="modeHalf" aria-pressed="true">Half object</button>
          <button type="button" id="modeFull" aria-pressed="false">Full object</button>
        </div>

        <div class="control">
          <label for="distance">Object distance (u)</label>
          <input
            type="range"
            id="distance"
            min="0.25"
            max="3"
            step="0.01"
            value="3"
          />
          <div class="scale"><span>far away</span><span>near lens</span></div>
        </div>

        <p class="presets-label">Standard cases</p>
        <div class="presets" id="presets">
          <button type="button" data-case="infinity">At infinity</button>
          <button type="button" data-case="beyond2F">Beyond 2F</button>
          <button type="button" data-case="at2F">At 2F</button>
          <button type="button" data-case="betweenF2F">Between F and 2F</button>
          <button type="button" data-case="atF">At F</button>
          <button type="button" data-case="insideF">Between F and O</button>
        </div>

        <p class="hint" id="hint"></p>
      </aside>

      <main class="stage">
        <section class="card">
          <canvas id="canvas"></canvas>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
